          working: list.filter((n) => n.status === 'working'),
          resolved: list.filter((n) => n.status === 'resolved'),
        }
      }

      /* ── Rating identity ───────────────────────────────────────────────
         The key is the fix's own `id` — the `ID` column of the index, which is
         the name of its folder in `data/fixes/<id>/`. It is permanent, so a
         verdict stays attached to the fix no matter how the row is re-parsed,
         re-sorted or regenerated. A live annotation is keyed the same way (its
         note id IS the fix id), so a fix can be rated the moment it is closed,
         without waiting for the index to be rebuilt.

         The index is generated (`server/build-index.mjs`), so the column is
         always there. If it ever is not, the key comes out empty and the
         ratings server answers 400 — a visible failure, never a verdict
         quietly landing on the wrong fix. */

      /* «Зроблено» — parsed out of fixlog.md. Columns are found by header name
         rather than position, so an extra column added later does not silently
         shift the route into the request. */
      function parseDone(md) {
        const lines = md.split('\n')
        const isRow = (l) => l.trim().startsWith('|')
        /* Значення в комірці МОЖЕ містити пайп: генератор індексу
           (`server/build-index.mjs`) екранує його як `\|`, бо інакше він
           розрізав би рядок таблиці. Наївний `split('|')` цього не знав і
           різав рядок посеред значення — усі колонки після місця екранування
           з'їжджали на одну. 13 із 287 архівних рядків через це показували
           чужий текст в «Агент»/«Деталі» і сміття замість `ID`, а Send back
           на такому рядку летів на :4748 з невалідним ключем і діставав 400.
           Тому ріжемо посимвольно: роздільник — лише НЕекранований `|`, а зі
           значення екранування знімається. */
        const cells = (l) => {
          let s = l.trim()
          if (s.startsWith('|')) s = s.slice(1)
          /* Кінцевий пайп — лише справжній: `\|` наприкінці це частина
             значення, і зрізати його означало б лишити висячий слеш. */
          if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1)
          const out = []
          let cur = ''
          for (let i = 0; i < s.length; i++) {
            if (s[i] === '\\' && s[i + 1] === '|') { cur += '|'; i++; continue }
            if (s[i] === '|') { out.push(cur.trim()); cur = ''; continue }
            cur += s[i]
          }
          out.push(cur.trim())
          return out
        }

        const out = []
        /* «те саме» in the route column means "the same screen as the row
           above" — log shorthand. Resolved here (carried forward), so the
           drawer and the route grouping get a real path. */
        let prevRoute = ''
        /* Рядок лога несе тільки «15:32» — доба живе в заголовку секції
           «## 2026-08-12» вище. Без неї «3хв тому» рахувалося б від сьогодні
           для рядків усіх днів, і вчорашній лог виглядав би щойно зробленим. */
        let day = ''
        /* Розкладка колонок ЖИВЕ ДОВШЕ за суцільний блок рядків. Раніше
           парсер вимагав «шапка + роздільник» безпосередньо перед рядками і
           зупиняв таблицю на першому ж порожньому рядку — а порожній рядок
           з'являється щоразу, коли агент дописує свій рядок через `>>` після
           файлу без завершального \n. Півсотні найсвіжіших правок через це
           не доїжджали на сторінку взагалі: у лозі є, у таблиці немає. Тепер
           таблиця триває, доки не почалася нова шапка. */
        let map = null
        for (let i = 0; i < lines.length; i++) {
          const h = lines[i].match(/^##\s+(\d{4})-(\d{2})-(\d{2})/)
          if (h) { day = h.slice(1).map(Number); map = null; continue }
          if (!isRow(lines[i])) continue
          /* Шапка: рядок таблиці, під яким роздільник. */
          if (isRow(lines[i + 1] || '') && /^[\s|:-]+$/.test(lines[i + 1])) {
            const head = cells(lines[i]).map((c) => plain(c).toLowerCase())
            const col = (re) => head.findIndex((c) => re.test(c))
            map = {
              time: col(/^час$|^time$/),
              dur: col(/трив|роботи|duration|elapsed/),
              route: col(/роут|route|шлях/),
              req: col(/запит|request/),
              /* Колонка двічі міняла назву: спершу «Маршрут» (куди віддали
                 правку), потім «Агент» (хто її зробив). Обидві живі в цьому
                 файлі — лог append-only, старі секції не переписуються. Шукати
                 лише одну назву означає лишити половину рядків без виконавця,
                 і саме так воно й було: секції з «Агент» малювали прочерк. */
              lane: col(/маршрут|агент|agent|lane/),
              did: col(/зроблено|результат|did/),
              /* Ім'я теки правки — воно ж ключ оцінки. */
              id: col(/^id$/),
            }
            i++            // проковтнути роздільник
            continue
          }
          if (!map) continue
          const c = cells(lines[i])
          const pick = (k) => (map[k] >= 0 ? c[map[k]] || '' : '')
          const time = pick('time')
          const route = pick('route')
          const routePlain = plain(route)
          const resolved =
            /^те саме/i.test(routePlain) && prevRoute ? prevRoute : routePlain
          if (resolved.startsWith('/')) prevRoute = resolved
          const hm = plain(time).match(/(\d{1,2}):(\d{2})/)
          out.push({
            key: plain(pick('id')),
            time,
            /* 0, якщо час або доба нечитабельні (у лозі бувають «10:0x»
               і «10:2x» — навмисна неточність ранніх рядків). Тоді комірка
               показує текст як він написаний. */
            at: day && hm
              ? new Date(day[0], day[1] - 1, day[2], +hm[1], +hm[2]).getTime()
              : 0,
            route,
            routeRes: resolved,
            dur: pick('dur'),
            req: pick('req'),
            laneRaw: pick('lane'),
            did: pick('did'),
          })
        }
        return out
      }

      /* ── Render ───────────────────────────────────────────────────────── */

      /* One panel by default, not three grouped lists: the user scans across
         statuses ("what is still open, what did opencode do") far more often
         than within one. Sorting is therefore the grouping tool — click a
         header instead of being locked into someone else's sections. «За
         сторінками» only re-cuts the same panel per route; the design is the
         same slab either way. */
      const state = { ratings: {}, ratingsErr: '', rows: [], sort: 'fresh', dir: 1 }

      /* The drawer walks the list the user is actually looking at — the
         current sort order, not insertion order — so ‹ › match what the table
         shows above it. Refreshed on every render so a re-sort while the
         drawer is open does not desync the arrows. */
      let visible = []
      let cursor = -1


      /* Inline SVG, not text glyphs. A character like ★ or ⟳ is sized and
         aligned by the font — it shifts baseline, differs across systems and
         cannot take a stroke width. These are drawn, so they sit on the same
         optical grid everywhere. currentColor keeps every existing colour
         rule working unchanged. */
      const SVG = {
        /* Pause/play пішли разом із паузою: контракт нот знає pending,
           working і resolved, і жоден із переходів не є «призупинити».
           `redo` — одна дія одного жанру: send-back правки через :4748.
           Живу ноту цією кнопкою в чергу не повертають — `rwCell` віддає її
           лише рядкам, які вже не `new`/`ask`, і летить вона на /rework. */
        check: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12Z"/><path d="M8.5 12.5L10.5 14.5L15.5 9.5"/></g></svg>',
        del: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5001 6H3.5"/><path d="M18.8332 8.5L18.3732 15.3991C18.1962 18.054 18.1077 19.3815 17.2427 20.1907C16.3777 21 15.0473 21 12.3865 21H11.6132C8.95235 21 7.62195 21 6.75694 20.1907C5.89194 19.3815 5.80344 18.054 5.62644 15.3991L5.1665 8.5"/><path d="M9.5 11L10 16"/><path d="M14.5 11L14 16"/><path d="M6.5 6C6.55588 6 6.58382 6 6.60915 5.99936C7.43259 5.97849 8.15902 5.45491 8.43922 4.68032C8.44784 4.65649 8.45667 4.62999 8.47434 4.57697L8.57143 4.28571C8.65431 4.03708 8.69575 3.91276 8.75071 3.8072C8.97001 3.38607 9.37574 3.09364 9.84461 3.01877C9.96213 3 10.0932 3 10.3553 3H13.6447C13.9068 3 14.0379 3 14.1554 3.01877C14.6243 3.09364 15.03 3.38607 15.2493 3.8072C15.3043 3.91276 15.3457 4.03708 15.4286 4.28571L15.5257 4.57697C15.5433 4.62992 15.5522 4.65651 15.5608 4.68032C15.841 5.45491 16.5674 5.97849 17.3909 5.99936C17.4162 6 17.4441 6 17.5 6"/></g></svg>',
        redo: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 13.5997 2.37562 15.1116 3.04346 16.4525C3.22094 16.8088 3.28001 17.2161 3.17712 17.6006L2.58151 19.8267C2.32295 20.793 3.20701 21.677 4.17335 21.4185L6.39939 20.8229C6.78393 20.72 7.19121 20.7791 7.54753 20.9565C8.88837 21.6244 10.4003 22 12 22Z"/></g></svg>',
        info: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 17V11"/><path d="M12 8H12.0001"/></g></svg>',
      }

      /* Порядок сортування по статусу = порядок, у якому рядок вимагає уваги:
         відправлене на доробку, потім те, що зараз біжить, потім нове в
         черзі, і аж наприкінці архів із fixlog.md.

         Стану «зроблено, чекає на перевірку» тут більше немає, і це не
         скорочення списку, а зміна конвеєра: закриття ноти перестало бути
         людським кроком. Сторож сам дописує рядок у fixlog.md і закриває
         ноту після вдалої правки, а користувач перевіряє результат на самому
         екрані, а не в цій таблиці. Тобто `resolved` тепер живе секунди — і
         власної мови (зелений тінт, підпис «Done · check it», кнопки Send
         back / Delete) не заслуговує: у ці секунди конвеєр ще працює з
         нотою, тож малюється вона як `wip`. Зроблена робота приходить у
         таблицю рівно в одному вигляді — сірою галочкою рядка з лога.

         Найвище — не доробка, а `ask`: нота, під якою агент лишив питання і
         зупинився. Решта станів чекає МАШИНУ (доробку хтось візьме, робота
         біжить, нове стоїть у черзі й дочекається сторожа), і тільки цей
         чекає ЛЮДИНУ. Поки вона не відповість, по цьому рядку конвеєр стоїть
         намертво — і саме тому він перший. */
      const RANK = { ask: 0, redo: 1, wip: 2, new: 3, done: 4 }

      /* Rework history of a row. The server's source of truth is the
         `reworks` array; records written before the history existed carry a
         single `rework` slot — read both, so an old fixlog-ratings.json needs
         no migration to render. */
      const rwOfKey = (key) => {
        const rec = state.ratings[key]
        if (!rec) return []
        return Array.isArray(rec.reworks) ? rec.reworks : rec.rework ? [rec.rework] : []
      }
      const rwOf = (r) => rwOfKey(r.key)
      /* Only the LAST iteration can be open — the server amends an open one
         instead of stacking a second. */
      const openRw = (r) => {
        const l = rwOf(r)
        const last = l[l.length - 1]
        return last && !last.done ? last : null
      }

      /* Питання, яким агент зупинив роботу: останнє слово в треді ноти за
         агентом, тобто відповідати мусить людина. Саме за цією ознакою
         сторож таку ноту НЕ бере в роботу («чекають людину» в його лозі), і
         таблиця мусить говорити тією самою мовою — інакше рядок, що чекає на
         відповідь, виглядає як звичайна нова нота, до якої просто ще не
         дійшли руки. Повертається саме повідомлення, бо рядок його ще й
         показує. */
      const askOf = (r) => {
        const t = Array.isArray(r.thread) ? r.thread : []
        const last = t[t.length - 1]
        return last && last.role === 'agent' ? last : null
      }

      /* Effective status, computed — never stored. A finished fix that was
         sent back is not "done" any more, and that has to be true for sorting
         as well as for the dot, so both read it from here rather than from a
         field somebody has to remember to update.

         `ask` рахується лише для `new`: у роботі щось справді біжить, і
         жовтий прапорець «стоїмо» був би там неправдою навіть за наявності
         питання в треді. */
      const stOf = (r) =>
        openRw(r) ? 'redo' : r.status === 'new' && askOf(r) ? 'ask' : r.status

      /* Час, який ця конкретна комірка мусить рахувати. Один рядок правила,
         бо семантика колонки одна на всі стани: «скільки минуло відтоді, як
         рядок став тим, чим він зараз є».

         Для нової ноти це мить, коли її створили: вік у черзі — і є питання
         («скільки вона лежить, поки її ніхто не взяв»). Для ноти в роботі це
         мить, коли її ВЗЯЛИ. Колонка показувала «2d» на правці, яку сторож
         запустив хвилину тому, і це читалось як «два дні ніхто не чіпав» —
         рівно навпаки до правди. Тепер там «1m», а час створення лишається
         в title комірки, бо саме він відповідає на друге питання: «а взагалі
         відколи вона висить». Для архівного рядка джерело одне — час у лозі.

         Ця ж функція годує смуги давності й сортування за часом, інакше
         рядок показував би «1m» під заголовком «Yesterday». */
      const atOf = (r) =>
        (r.status === 'wip' && (r.startedAt || 0)) || r.at || 0

      /* Роут, за яким МОЖНА навігувати, витягнутий зі значення, яке майже
         ніколи не є чистим шляхом. Колонка «Роут» у fixlog.md — рукописна
         проза: агент пише туди і сам шлях, і елемент, по якому клацнули
         («`/search` (`Search` → `.sr-featured__tag`, «Sponsored»)»), а іноді
         взагалі не шлях («усі сторінки налаштувань», «глобально (іконки)»).
         Виграє перший /path-подібний токен; значення без шляху дає порожній
         рядок — такий рядок нікуди не веде і в дровері не відкривається.

         Одна функція на два виклики навмисно: панель групується САМЕ за тим
         екраном, який відкриє рядок усередині неї. Поки дровер брав сире
         `routePath`, а заголовок панелі — очищений, вони розходилися: клік по
         назві панелі показував потрібний макет, а клік по рядку віддавав
         iframe'у рядок на кшталт «/search (Search → …)», який SPA не знає, і
         `path="*"` малював лендинг. 173 з 255 рядків лога так і відкривалися. */
      const navRoute = (routePath) => {
        const m = String(routePath || '').match(/\/[\w\-./:%]*/)
        return m ? m[0].replace(/[.,;:)]+$/, '') : ''
      }
      /* Те саме значення в ролі ключа групи: заголовок панелі — це ім'я
         екрана, а «інше» збирає все, що екраном не є. */
      const groupKey = navRoute

      /* ХВ:СС — one shape for every duration in the column: the live clock
         of a running fix, the duration of a finished one, and the «3.9хв»
         text an agent typed into fixlog.md all render identically. Mixed
         shapes («45с», «2хв 10с», «1год 5хв») made the column unscannable —
         magnitudes have to line up as digits to be comparable at a glance.
         Хвилини НЕ загортаються на 60: прогін, що висить 83:20, має виглядати
         неправильно, а не вдавати годину з чимось. Секунди лишаються, бо
         дрібні правки живуть менше за хвилину, і 00:00 на всіх них не
         розрізняло б швидке від миттєвого. */
      const fmtMS = (sec) => {
        const s = Math.max(0, Math.floor(sec))
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`
      }
      const fmtDur = (ms) => fmtMS(ms / 1000)

      /* Durations in fixlog.md are prose, written by hand by whichever agent
         closed the fix: «45с», «3.9хв», «2хв 10с», «1год 5хв», «<1хв». Parsed
         to seconds so the column can show them in the same ГГ:ХХ shape — and
         so sorting compares durations instead of strings, where «9хв» would
         land after «40с». Unparseable text returns null and is shown as it
         was written: better an odd cell than a confident 00:00 lie. */
      const durSecs = (text) => {
        const t = plain(text || '').toLowerCase().replace(',', '.')
        if (!t) return null
        /* «<1хв» — це «менше за», а не «одна»: спершу знак, потім числа. */
        if (t.startsWith('<')) return 0
        const grab = (unit) => {
          const m = t.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(?:${unit})`))
          return m ? parseFloat(m[1]) : 0
        }
        const h = grab('год|г|h'), m = grab('хв|м|m'), sec = grab('с|s')
        if (!h && !m && !sec) return null
        return h * 3600 + m * 60 + sec
      }

      /* Прочитане — у ГГ:ХХ, непрочитане — як написано, порожнє — риска. */
      const durCell = (text) => {
        if (!plain(text || '').trim()) return '<span class="muted">—</span>'
        const sec = durSecs(text)
        return sec === null ? esc(plain(text)) : fmtMS(sec)
      }

      /* Column widths live in CSS (.col--*), because the table is
         table-layout:fixed and one place for the numbers is what stops the
         header and the body from disagreeing. */
      /* `t` is what the header shows. Статус used to show NOTHING — a lone
         dot per row with the tally as its legend — and that is exactly what
         made the table unreadable: an unlabelled colour column is a legend the
         reader has to hold in their head. It is now a named column like the
         rest. */
      /* Перша колонка — «#», а не «ID»: у ній стоїть ПОРЯДКОВИЙ номер правки
         (`r.num`) — коротка ручка, якою правку називають уголос («правка 14»)
         і яку малює пін у дровері. Справжній ключ (`r.key`, ім'я теки
         `data/fixes/<id>/`) у таблиці не показується взагалі: він задовгий
         для комірки й не потрібен оку — його видно в діалозі Details. Поки
         заголовок казав «ID», колонка обіцяла ключ і показувала лічильник. */
      const COLS = [
        { k: 'num',    t: '#' },
        { k: 'status', t: 'Status' },
        { k: 'time',   t: 'Time' },
        { k: 'dur',    t: 'Dur' },
        { k: 'req',    t: 'Request' },
        { k: 'lane',   t: 'Agent' },
        { k: 'did',    t: 'Details' },
        { k: 'redo',   t: 'Reworks' },
      ]

      /* «Needs you» — єдиний підпис у стовпчику, що звертається до читача, а
         не описує стан справи збоку. Це навмисне: усі інші стани — новини
         про конвеєр, а цей — прохання до того, хто дивиться. Влазить у ті
         самі 98px, що й «In progress». */
      const STATUS_LABEL = { ask: 'Needs you', redo: 'Sent back', new: 'New', wip: 'In progress', done: 'Done' }

      /* THE column grid, in one place. Widths live in the .col--* CSS rules;
         this colgroup pins them to every table on the page — the shared
         header strip AND each panel under it. Panels have no thead, and
         table-layout:fixed reads its grid from the first ROW when no cols
         exist — which handed every panel its own improvised grid that could
         never line up with the header above it. */
      const COLGROUP = `<colgroup>${COLS.map((c) => `<col class="col--${c.k}">`).join('')}</colgroup>`
      document.querySelectorAll('#gheadWrap table').forEach((t) =>
        t.insertAdjacentHTML('afterbegin', COLGROUP))

      /* Один спінер на сторінку. Розмір 11px тримає його в межах рядка
         таблиці (.st має min-height: 19px), тобто мітка стає при слові, а не
         роздуває рядок. */
      const SPIN_SVG =
        '<svg class="spin" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle opacity=".25" cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>'

      /* The state mark, used by the status column AND the tally so the
         legend can never drift from the rows it explains. done → a checkbox;
         wip → the spinner, because it is the one state where something is
         running THIS second; everything else keeps its dot. */
      const stMark = (k) =>
        k === 'done'
          ? '<svg class="ok-ic" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12Z"/><path d="M8.5 12.5L10.5 14.5L15.5 9.5"/></g></svg>'
          : k === 'wip'
            ? SPIN_SVG
            : `<i class="dot dot--${k}"></i>`

      /* The Доробки cell: send-back control plus the thread length. Open
         work has nothing to send back yet, so it shows a dash like every
         other not-applicable cell. */
      function rwCell(r) {
        const st = stOf(r)
        /* Only work NOBODY has started can be managed: a new note can be
           marked resolved by hand or deleted. Once an agent holds it (wip /
           redo) there is nothing safe to offer — you cannot un-run a running
           fix. Delete arms on the first click and fires on the second:
           cheaper than a modal, still not one twitch.

           Resolve does NOT simply drop the row: `PATCH {"status":"resolved"}`
           makes the note an orphan in `resolved`, and the watchdog's orphan
           sweep (`watchdog/dispatcher.mjs`) closes it like any finished fix —
           a `data/fixes/<id>/` folder and a row in the index, whose «зроблено»
           reads «Виконавець не лишив опису правки». That is the intended use
           (the fix was made outside the conveyor and should be recorded), so
           the action stays — but the tooltip now says it instead of promising
           a silent disappearance. Nothing to record → Delete. */
        /* `ask` — та сама нота в черзі, просто із запитанням над нею: агент
           її не тримає, тож ті самі дві дії лишаються доступні. */
        if (st === 'new' || st === 'ask') {
          const id = esc(r.key)
          return `<span class="rw acts">
              <button type="button" class="icon-btn act" data-resolve="${id}" aria-label="Resolve" title="Resolve — logged as a fix with no description">${SVG.check}</button>
              <button type="button" class="icon-btn act act--del" data-del="${id}" aria-label="Delete" title="Delete (second click confirms)">${SVG.del}</button>
            </span>`
        }
        if (st === 'wip') return '<span class="muted">—</span>'
        const list = rwOf(r)
        const open = openRw(r)
        return `<span class="rw">
            <button type="button" class="icon-btn redo${open ? ' redo--on' : ''}" data-redo="${esc(r.key)}"
              aria-label="Send back"
              title="${open ? 'Sent back: ' + esc(open.note) : 'Send back'}">${SVG.redo}</button>
            ${list.length ? `<span class="rw-n">×${list.length}</span>` : ''}
          </span>`
      }

      /* The header lives twice — over the flat table and as the shared
         strip over the panels — built from one string so they can never
         drift, and skipped entirely when nothing changed: the auto-refresh
         must not rebuild focusable elements under the keyboard every 10s. */
      let headSig = ''
      function renderHead() {
        const html = COLS.map((c) => {
          const on = state.sort === c.k
          const arrow = on ? (state.dir > 0 ? '↑' : '↓') : ''
          return `<th data-sort="${c.k}" tabindex="0"
            class="col--${c.k}${on ? ' is-sorted' : ''}"
            aria-sort="${on ? (state.dir > 0 ? 'ascending' : 'descending') : 'none'}"
            title="Sort">${c.t}<span class="ind">${arrow}</span></th>`
        }).join('')
        if (html === headSig) return
        headSig = html
        $('gthead').innerHTML = html
      }

      /* ── Incremental DOM ──────────────────────────────────────────────────
         The 10s refresh used to rebuild tbody.innerHTML wholesale — every
         cycle blinked, dropped hover, scroll anchoring and the armed state
         of buttons. Now the table is reconciled, not repainted:

           * every logical block (a fix with its thread, a group header, a
             gap, the empty state) is a UNIT with a stable key;
           * a unit's cells are compared against the TEMPLATE strings of the
             previous render — never against live DOM, which tick() mutates
             (elapsed counters would otherwise look "changed" every cycle
             and flicker back to empty);
           * only genuinely changed cells are swapped, only misplaced rows
             are moved (insertBefore of the EXISTING node — reorder, not
             recreation), only vanished units are removed.

         Sorting, grouping and theme still go through the same path: for
         them the reconciler degenerates into a pure reorder, which is
         exactly the cheapest correct thing. */
      const dom = new Map() // unit key → { trHtml: [..], cells: [[..]], nodes: [tr..] }

      const parseTr = (html) => {
        /* <template> parses table parts at top level — a bare div would
           silently drop the <tr>. */
        const tpl = document.createElement('template')
        tpl.innerHTML = html
        return tpl.content.firstElementChild
      }

      const syncAttrs = (oldEl, newEl) => {
        for (const a of [...oldEl.attributes])
          if (!newEl.hasAttribute(a.name)) oldEl.removeAttribute(a.name)
        for (const a of [...newEl.attributes])
          if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value)
      }

      /* Returns the unit's live nodes, updated in place where possible. */
      function syncUnit(key, trHtmlList) {
        const prev = dom.get(key)
        if (!prev) {
          const nodes = trHtmlList.map(parseTr)
          dom.set(key, {
            trHtml: trHtmlList.slice(),
            cells: nodes.map((tr) => [...tr.children].map((td) => td.outerHTML)),
            nodes,
          })
          return dom.get(key).nodes
        }
        const nodes = []
        const cells = []
        for (let i = 0; i < trHtmlList.length; i++) {
          if (prev.trHtml[i] === trHtmlList[i] && prev.nodes[i]) {
            /* Template unchanged — the live node stays exactly as it is,
               runtime state (focus, armed delete, ticking clock) included. */
            nodes.push(prev.nodes[i])
            cells.push(prev.cells[i])
            continue
          }
          const fresh = parseTr(trHtmlList[i])
          const freshCells = [...fresh.children].map((td) => td.outerHTML)
          const old = prev.nodes[i]
          if (!old || old.children.length !== fresh.children.length) {
            /* A thread grew, or the unit changed shape — here the whole tr
               is the update granule. */
            if (old) old.replaceWith(fresh)
            nodes.push(fresh)
            cells.push(freshCells)
            continue
          }
          /* Same shape: touch only the cells whose TEMPLATE changed. */
          syncAttrs(old, fresh)
          for (let j = 0; j < freshCells.length; j++) {
            if (prev.cells[i][j] !== freshCells[j]) {
              old.children[j].replaceWith(fresh.children[j].cloneNode(true))
            }
          }
          nodes.push(old)
          cells.push(freshCells)
        }
        /* A thread that shrank: drop the tail rows. */
        for (let i = trHtmlList.length; i < prev.nodes.length; i++) prev.nodes[i].remove()
        prev.trHtml = trHtmlList.slice()
        prev.cells = cells
        prev.nodes = nodes
        return nodes
      }

      /* Places every unit's nodes in order INSIDE the given tbody, moving
         only what is misplaced. In panel mode this runs once per panel, and
         a fix whose route changed groups simply gets its existing rows
         reparented by the same insertBefore. The removal sweep is global and
         happens once per render, in renderBody — a unit "missing" from one
         panel may just live in another. */
      let renderSeen = null
      function commit(units, tbody) {
        let anchor = null
        for (const u of units) {
          renderSeen.add(u.key)
          for (const n of syncUnit(u.key, u.trs)) {
            const ref = anchor ? anchor.nextSibling : tbody.firstChild
            if (n !== ref) tbody.insertBefore(n, ref)
            anchor = n
          }
        }
      }
      function sweepDom() {
        for (const [key, rec] of dom) {
          if (!renderSeen.has(key)) {
            rec.nodes.forEach((n) => n.remove())
            dom.delete(key)
          }
        }
      }

      /* Live panels in «За сторінками» mode: group key → its DOM. Panels are
         reconciled like rows — created once, retitled and reordered in
         place, removed when their route empties out. */
      const panels = new Map()

      function renderBody() {
        const k = state.sort
        const rows = state.rows.slice().sort((a, b) => {
          let av, bv
          /* Default order: newest first, across every status. Live annotations
             carry a real timestamp; done rows only have the log's HH:MM, so
             their order comes from position in the append-only log — later
             line means later fix. */
          if (k === 'fresh') return (b.fresh || 0) - (a.fresh || 0)
          if (k === 'status') { av = RANK[stOf(a)]; bv = RANK[stOf(b)] }
          else if (k === 'num') { av = a.num || 1e9; bv = b.num || 1e9 }
          /* Той самий парсер, що й малює комірку, — інакше стовпчик
             сортувався б не так, як читається. */
          else if (k === 'dur') { av = durSecs(a.dur) ?? -1; bv = durSecs(b.dur) ?? -1 }
          else if (k === 'time') { av = atOf(a); bv = atOf(b) }
          else if (k === 'redo') { av = rwOf(a).length; bv = rwOf(b).length }
          /* Ключ колонки ≠ ім'я поля рядка: колонка зветься `lane`, а
             значення лежить у `laneRaw` (сире, як у лозі, — рендер його
             розбирає сам). Без цієї підміни гілка читала `a['lane']`,
             тобто undefined для КОЖНОГО рядка, і клік по «Agent» просто
             нічого не сортував. */
          else {
            const f = k === 'lane' ? 'laneRaw' : k
            av = plain(a[f] || '').toLowerCase(); bv = plain(b[f] || '').toLowerCase()
          }
          if (av < bv) return -1 * state.dir
          if (av > bv) return 1 * state.dir
          /* Stable tiebreak so equal keys never reshuffle between renders. */
          return (b.ts || 0) - (a.ts || 0)
        })

        /* Glyph AND word. The glyph is what the eye finds; the word is what
           makes the find mean something without a hover, a legend or a
           memorised palette. Вибір гліфа цілком у stMark — тут його більше
           не дублюємо, інакше колонка й легенда розійшлися б. */
        const stIcon = (st) =>
          `<span class="st st--${st}">${stMark(st)}<span class="st__w">${STATUS_LABEL[st]}</span></span>`
        const rowHtml = (r, i) => {
              const st = stOf(r)
              const cls = st === 'wip' ? 'is-wip' : st === 'redo' ? 'is-redo' : st === 'ask' ? 'is-ask' : ''
              /* Питання показуємо в рядку, а не ховаємо в дровер: щоб
                 відповісти, треба його прочитати, а відкривати заради цього
                 ще одну поверхню — рівно та ціна, через яку рядок і «висів». */
              const q = st === 'ask' ? askOf(r) : null
              /* data-i is the row's index in `visible`, carried on the tr
                 because thread rows sit between parents and positional
                 indexOf would drift. Thread rows borrow the parent's index:
                 clicking anywhere in the thread opens the parent's screen. */
              const parent = `<tr class="${cls}" data-route="${esc(navRoute(r.routePath))}" data-i="${i}" tabindex="0"
              data-x="${r.x ?? ''}" data-y="${r.y ?? ''}" data-num="${r.num ?? ''}">
              <td class="idx">${r.num || ''}</td>
              <td>${stIcon(st)}</td>
              <td class="tab">${
                atOf(r)
                  ? `<span class="ago" data-at="${atOf(r)}" title="${esc(
                      /* На рядку в роботі число каже «взяли стільки-то тому»,
                         тож підказка мусить назвати обидві точки — інакше
                         зміна семантики була б непомітною підміною. */
                      st === 'wip' && r.startedAt
                        ? `Picked up ${hhmm(r.startedAt)} · created ${hhmm(r.at)}`
                        : plain(r.time),
                    )}"></span>`
                  : esc(plain(r.time))
              }</td>
              <td class="tab tab--r">${
                st === 'wip'
                  /* Годинник роботи біжить від моменту, коли її ВЗЯЛИ, а не
                     коли анотацію намалювали. Тулбар перезаливає свої локальні
                     копії зі СТАРИМ timestamp — рахунок від нього показував
                     «04:12» на правці, яку щойно почали. */
                  ? `<span class="elapsed" data-since="${r.startedAt || r.ts || 0}"></span>`
                  : durCell(r.dur)
              }</td>
              <td><div class="req" title="${esc(plain(r.req || ''))}">${inline(r.req || '—')}</div>${
                q
                  ? `<div class="ask-q" title="${esc(plain(q.content || ''))}"><span class="ask-q__b branch" aria-hidden="true"></span><span class="ask-q__t">${
                      inline(q.content || '')
                    }</span></div>`
                  : ''
              }</td>
              <td>${lane(r.laneRaw)}</td>
              <td>${
                /* Живі ноти не мають `did` — зате мають те, чого немає в
                   архівних рядків: сам елемент, на який показали пальцем
                   (роут, селектор, ланцюг компонентів, текст) і розмову з
                   агентом. Кнопка тут раніше з'являлась лише за непорожнім
                   тредом, тобто в переважної більшості живих нот колонка
                   стояла прочерком, хоча показати було що. Тепер подробиці
                   доступні завжди, коли є хоч один із трьох носіїв. */
                r.did || st === 'redo' || r.el || (r.thread && r.thread.length)
                  ? `<button type="button" class="icon-btn info${
                      st === 'redo' ? ' info--redo' : ''
                    }" data-info="${esc(r.key)}" aria-label="Details" title="Details">${SVG.info}</button>`
                  : '<span class="muted">—</span>'
              }</td>
              <td>${rwCell(r)}</td>
            </tr>`
              /* The rework thread: one child row per iteration, branch glyph
                 in the # column, the reviewer's note in the request column —
                 the note IS the request of its iteration. An open iteration
                 shows a live clock; a closed one, how long the round took. */
              const thread = rwOf(r).map((rw, j, l) => {
                const openIt = !rw.done
                const at = Date.parse(rw.at) || 0
                const label = openIt ? 'Sent back' : 'Fixed'
                return `<tr class="sub${openIt ? ' is-redo' : ''}" data-route="${esc(navRoute(r.routePath))}" data-i="${i}">
                <td class="tab"><span class="sub__b branch${
                  j === l.length - 1 ? '' : ' branch--mid'
                }" aria-hidden="true"></span> <span class="sub__id">${
                  /* Suffix id: iteration 2 of fix 74 is «74.2» — the handle a
                     human quotes back about a round, exactly like num for the
                     fix itself. Before load() has numbered the rows the base
                     is briefly a bare dot («.2»); the next render fills it. */
                  (r.num ? r.num + '.' : '.') + (j + 1)
                }</span></td>
                <td><span class="st ${openIt ? 'st--redo' : 'st--fixed'}"><i class="dot ${openIt ? 'dot--redo' : 'dot--fixed'}"></i><span class="st__w">${label}</span></span></td>
                <td class="tab">${at ? hhmm(at) : ''}</td>
                <td class="tab tab--r">${
                  openIt
                    ? `<span class="elapsed" data-since="${at}"></span>`
                    : (rw.doneAt ? fmtDur((Date.parse(rw.doneAt) || at) - at) : '<span class="muted">—</span>')
                }</td>
                <td><div class="req" title="${esc(plain(rw.note || ''))}">${inline(rw.note || '—')}</div></td>
                <td><span class="muted">—</span></td>
                <td><span class="muted">—</span></td>
                <td><span class="muted">—</span></td>
              </tr>`
              })
              return [parent, ...thread]
        }

        /* A row unit is the parent tr plus its thread trs — the thread
           belongs to the fix, so it moves and dies with it. */
        visible = []
        renderSeen = new Set()
        const rowUnit = (r) => {
          const i = visible.push(r) - 1
          return { key: 'row:' + r.key, trs: rowHtml(r, i) }
        }
        /* Both modes render the SAME panel; they differ only in how the rows
           are cut into panels — «Всі» cuts by recency band, «По сторінках» by
           route. An empty log is that same panel with the empty state inside,
           whatever the toggle says. Keeping one code path is the point: two
           paths were what let the two views drift apart. */
        const usePanels = grouped && rows.length > 0
        if (!rows.length) {
          syncPanels([[ALL_KEY, [{ key: 'empty', trs: [`<tr><td colspan="${COLS.length}" class="empty">
                <b>Nothing yet</b>
                <span>Notes from the overlay and rows from fixlog.md show up here.</span>
              </td></tr>`] }], 'All fixes']])
        } else if (!usePanels) {
          /* Звичайний перегляд теж згрупований — за давністю. Плаский список
             із двохсот рядків не має жодного орієнтира: «сьогоднішнє» від
             «тижневого» відділяє лише зміна цифр у стовпчику часу. Смуги
             дають той самий орієнтир, що й роути в іншому режимі, і по тій
             самій осі, за якою список і так відсортований за замовчуванням.

             Ряд свідомо грубий і нерівномірний: свіже цікавить із точністю до
             півгодини, вчорашнє — з точністю до дня. Рядки лога без читабельного
             часу («10:2x» у ранніх записах) осідають у хвіст окремою смугою,
             а не вдають, ніби вони з 1970 року. */
          const buckets = new Map()
          for (const r of rows) {
            const k = ageBucket(atOf(r))
            if (!buckets.has(k)) buckets.set(k, [])
            buckets.get(k).push(r)
          }
          const ordered = [...buckets.entries()].sort((a, b) => a[0] - b[0])
          syncPanels(ordered.map(([k, members]) =>
            [AGE_KEY + k, members.map(rowUnit), AGE_LABEL[k]]))
        } else {
          /* Group by normalised route. Rows arrive already sorted by the
             active sort, and grouping only PARTITIONS that order — inside a
             group the sort stays whatever the header says. Groups themselves
             are ordered by their freshest member: the screen someone touched
             last is the screen the reviewer came to check. */
          const groups = new Map()
          for (const r of rows) {
            const k = groupKey(r.routePath) || OTHER_KEY
            if (!groups.has(k)) groups.set(k, [])
            groups.get(k).push(r)
          }
          const freshest = (members) => Math.max(...members.map((r) => r.fresh || 0))
          const ordered = [...groups.entries()]
            .sort((a, b) => freshest(b[1]) - freshest(a[1]))
          syncPanels(ordered.map(([k, members]) => [k, members.map(rowUnit)]))
        }

        sweepDom()
      }

      /* The route in a panel header is a LINK into the same iframe preview
         the rows use — the panel names a screen, so clicking the name shows
         the screen. «інше» has no screen to show, and the single ungrouped
         panel names no screen at all; both stay plain spans. */
      const PAGE_IC = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.0296 2C6.23851 2 4.34296 2 3.17139 3.17157C1.99981 4.34315 2 6.22876 2 10V14C2 17.7712 2 19.6569 3.17157 20.8284"/><path d="M3.17139 20.8281C4.34296 21.9997 6.22858 21.9997 9.99981 21.9997L14 22C17.7712 22 19.6569 21.9997 20.8284 20.8281C22 19.6566 22 17.7712 22 14V13.5625"/><path d="M19.3516 7.61621C20.6558 8.78998 21.3078 9.3774 21.6538 10.1543C21.9998 10.9312 21.9998 11.8085 21.9998 13.5631"/><path d="M10.0298 2C11.5548 2 12.3173 2.00011 13.0093 2.26562C13.7012 2.53114 14.2651 3.03857 15.3929 4.05365L19.3516 7.61621"/><path d="M13 2.5V5C13 7.35702 13 8.53553 13.7322 9.26777C14.4645 10 15.643 10 18 10H21.5"/></g></svg>'
      /* Keys namespaced with \u0000 so no real route can ever collide
         with them — a route starting with a NUL byte does not exist. */
      const ALL_KEY = '\u0000all'
      const AGE_KEY = '\u0000age:'

      /* Сходинки давності. Індекс — і ключ панелі, і порядок згори вниз. */
      const AGE_LABEL = [
        'Just now',       // < 15 хв
        'Half an hour',   // < 45 хв
        'An hour',        // < 90 хв
        'A few hours',    // < 6 год
        'Earlier today',  // < 24 год
        'Yesterday',
        'This week',
        'Older',
        'No time',        // рядки лога, з яких час не читається
      ]
      const ageBucket = (at) => {
        if (!at) return 8
        const m = (Date.now() - at) / 60000
        if (m < 15) return 0
        if (m < 45) return 1
        if (m < 90) return 2
        if (m < 360) return 3
        if (m < 1440) return 4
        if (m < 2880) return 5
        if (m < 10080) return 6
        return 7
      }
      const OTHER_KEY = '\u0000other'

      function panelHead(key, n, label) {
        const name = label
          ? `<span class="grp__route grp__route--plain">${esc(label)}</span>`
          : key === OTHER_KEY
            ? '<span class="grp__route grp__route--plain">other</span>'
            : `<button type="button" class="grp__route" data-open-route="${esc(key)}"
                title="Preview ${esc(key)}">${PAGE_IC}${esc(key)}</button>`
        /* The empty state is a panel with nothing in it — a «×0» beside the
           words «поки що порожньо» would be counting the void. */
        return name + (n ? `<span class="grp__n">×${n}</span>` : '')
      }

      /* One PANEL per entry: own shell, title bar, tbody. Reconciled like
         everything else — created once, retitled only when the count or name
         changes, reordered with insertBefore, its rows committed into its own
         tbody. Panels without an entry this render are removed, and that is
         what makes the mode toggle free: «Усі правки» and the per-route
         panels are the same function fed a different set of keys. */
      function syncPanels(entries) {
        const gWrap = $('groups')
        const seenPanels = new Set()
        let anchor = null
        for (const [k, units, label] of entries) {
          seenPanels.add(k)
          let pnl = panels.get(k)
          if (!pnl) {
            const el = document.createElement('section')
            el.className = 'pnl'
            el.innerHTML = `<header class="pnl__head"></header><table>${COLGROUP}<tbody></tbody></table>`
            pnl = { el, head: el.firstElementChild, tbody: el.querySelector('tbody'), headHtml: '' }
            panels.set(k, pnl)
          }
          const rowCount = units.length && units[0].key !== 'empty' ? units.length : 0
          const headHtml = panelHead(k, rowCount, label)
          if (pnl.headHtml !== headHtml) {
            pnl.head.innerHTML = headHtml
            pnl.headHtml = headHtml
          }
          const ref = anchor ? anchor.nextSibling : gWrap.firstChild
          if (pnl.el !== ref) gWrap.insertBefore(pnl.el, ref)
          anchor = pnl.el
          commit(units, pnl.tbody)
        }
        for (const [k, pnl] of panels) {
          if (!seenPanels.has(k)) { pnl.el.remove(); panels.delete(k) }
        }
      }

      const render = () => { renderHead(); renderBody(); tick() }

      /* Live elapsed time for anything still running. Driven by its own 1s
         ticker rather than by the 10s data refresh — a counter that only moves
         when the table reloads looks frozen. Reads the annotation's own
         timestamp, so it survives a re-render without restarting. */
      function tick() {
        const now = Date.now()
        document.querySelectorAll('.elapsed').forEach((el) => {
          const since = Number(el.dataset.since) || 0
          if (!since) { el.textContent = '—'; return }
          el.textContent = fmtDur(now - since)
        })
        document.querySelectorAll('.ago').forEach((el) => {
          el.textContent = ago(Number(el.dataset.at) || 0)
        })
      }
      setInterval(tick, 1000)

      /* Header click sorts; clicking the active column flips direction. */
      function sortBy(k) {
        state.dir = state.sort === k ? -state.dir : 1
        state.sort = k
        render()
      }
      document.addEventListener('click', (e) => {
        const th = e.target.closest('th[data-sort]')
        if (!th) return
        sortBy(th.dataset.sort)
      })
      /* Headers and rows are focusable, so both answer the keyboard too. */
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return
        if (!e.target.closest) return
        const th = e.target.closest('th[data-sort]')
        if (th) { e.preventDefault(); sortBy(th.dataset.sort); return }
        const tr = e.target.closest('tr[data-i]')
        if (tr && e.target === tr) { e.preventDefault(); openAt(Number(tr.dataset.i)) }
      })

      /* ── Drawer ───────────────────────────────────────────────────────── */
      const dr = $('dr')

      function openAt(i) {
        if (i < 0 || i >= visible.length) return
        /* Рядок без справжнього роуту («усі сторінки налаштувань») показувати
           нема чого. Виходимо ДО зсуву курсора: інакше ‹ › і лічильник «12/255»
           переїхали б на рядок, якого в дровері так і не видно. */
        const route = navRoute(visible[i].routePath)
        if (!route) return
        cursor = i
        /* Mark the row (and its thread — they share data-i) being previewed,
           so ‹ › in the drawer visibly walks the table behind it. Renders
           pause while the drawer is open, so the class survives. */
        document.querySelectorAll('tr.is-current').forEach((el) => el.classList.remove('is-current'))
        document.querySelectorAll(`tr[data-i="${i}"]`).forEach((el) => el.classList.add('is-current'))
        const r = visible[i]
        openDrawer(
          route,
          r.x != null && r.y != null ? { x: r.x, y: r.y, num: r.num } : null,
          r.status === 'done' ? r.key : '',
          r,
        )
      }
      function openDrawer(route, pin, key, row) {
        if (!route || route === '—') return
        /* The name is the request itself — what was asked for is what
           identifies a fix to a human; the route is supporting detail. */
        $('drName').textContent = row ? plain(row.req || '—') : route
        $('drPos').textContent = cursor >= 0 ? `${cursor + 1}/${visible.length}` : ''
        $('drPrev').disabled = cursor <= 0
        $('drNext').disabled = cursor < 0 || cursor >= visible.length - 1
        /* Rating lives in the drawer too: the honest moment to judge a fix is
           while looking at the screen it changed, not while scanning a table.
           Only done rows have a verdict to give — open ones have nothing to
           rate yet. */
        const rate = $('drRate')
        if (key) {
          rate.hidden = false
          rate.dataset.key = key
          const open = row ? openRw(row) : null
          $('drRedo').dataset.redo = key
          $('drRedo').classList.toggle('redo--on', !!open)
        } else {
          rate.hidden = true
        }
        $('drOpen').href = route
        const f = $('drFrame')
        f.onload = () => pin && dropPin(f, pin)
        f.src = route
        dr.hidden = false
        document.body.style.overflow = 'hidden'
      }

      /* The drawer and the app are the same origin, so the pin goes INTO the
         iframe's document rather than floating over it — that way it scrolls
         with the content and stays on the element it marks.

         Retried, not fired once: `load` fires when the HTML document is done,
         but the app inside is a React SPA that mounts afterwards. At that
         moment the body is still near-zero height, so a pin placed at y=900
         lands past the end of the document and the scroll goes nowhere. The
         retry re-places it as the page grows and stops once the body is tall
         enough to actually hold it. */
      function closeDrawer() {
        dr.hidden = true
        document.querySelectorAll('tr.is-current').forEach((el) => el.classList.remove('is-current'))
        /* Blank the frame: otherwise the app keeps running behind the scrim,
           with its own timers, fetches and annotation toolbar alive. */
        $('drFrame').src = 'about:blank'
        document.body.style.overflow = ''
      }

      function dropPin(frame, pin) {
        const y = Number(pin.y) || 0
        let tries = 0

        const place = () => {
          let d
          try { d = frame.contentDocument } catch { return } // navigated cross-origin
          if (!d || !d.body) { if (++tries < 40) setTimeout(place, 100); return }

          let el = d.getElementById('fixlog-pin')
          if (!el) {
            el = d.createElement('div')
            el.id = 'fixlog-pin'
            el.textContent = pin.num || '1'
            /* Literal colours on purpose: this node is injected into ANOTHER
               document (the app's), which has never seen this page's tokens
               and must not be made to depend on them. */
            el.style.cssText = [
              'position:absolute', 'transform:translate(-50%,-50%)',
              'z-index:2147483647', 'width:28px', 'height:28px',
              'border-radius:50%', 'display:flex', 'align-items:center',
              'justify-content:center', 'background:#f5a524', 'color:#1a2333',
              'font:700 13px/1 system-ui,sans-serif',
              'box-shadow:0 0 0 3px rgba(245,165,36,.45), 0 2px 10px rgba(0,0,0,.35)',
              'pointer-events:none',
            ].join(';')
            d.body.appendChild(el)
          }
          el.style.left = `${pin.x}%`
          el.style.top = `${y}px`

          /* Keep going until the document is genuinely tall enough for the
             pin's position to mean anything — otherwise we would scroll to a
             page that has not been laid out yet. */
          const tall = d.documentElement.scrollHeight > y + 40
          if (tall) {
            frame.contentWindow.scrollTo({ top: Math.max(0, y - 220) })
          }
          if (++tries < 40 && !tall) setTimeout(place, 100)
        }

        place()
      }

      /* Group-header route → drawer with no row context: cursor parks at -1
         so ‹ › disable themselves and the position readout stays blank. */
      document.addEventListener('click', (e) => {
        const b = e.target.closest('[data-open-route]')
        if (!b) return
        cursor = -1
        openDrawer(b.dataset.openRoute, null, '', null)
      })

      $('drScrim').addEventListener('click', closeDrawer)
      $('drClose').addEventListener('click', closeDrawer)
      $('drPrev').addEventListener('click', () => openAt(cursor - 1))
      $('drNext').addEventListener('click', () => openAt(cursor + 1))
      document.addEventListener('keydown', (e) => {
        if (dr.hidden) return
        /* The dialog sits on top of the drawer: while it is open the keyboard
           belongs to it, or typing a note would walk the drawer and one Escape
           would close both at once. */
        if (!pop.hidden) return
        if (e.key === 'Escape') closeDrawer()
        if (e.key === 'ArrowLeft') openAt(cursor - 1)
        if (e.key === 'ArrowRight') openAt(cursor + 1)
      })
      /* Row opens the screen — but not when the click was aimed at a control
         that lives inside the same row: any button (Деталі, send-back), the
         selection checkbox, or a header. */
      document.addEventListener('click', (e) => {
        if (e.target.closest('button, a, input, th')) return
        const tr = e.target.closest('tr[data-route]')
        if (!tr) return
        const i = Number(tr.dataset.i)
        if (Number.isInteger(i)) openAt(i)
      })

      /* ── Note actions ─────────────────────────────────────────────────────
         Дві дії, і обидві — тільки на ще не взятій ноті. Resolve = PATCH
         {"status":"resolved"}: правку зробили повз конвеєр, і нота йде НЕ в
         нікуди — сторож підбирає її як сирітку в `resolved` і закриває як
         звичайну правку, з текою `data/fixes/<id>/` і рядком в індексі без
         опису. Це і є сенс дії — записати правку, яку зробили руками; кнопка
         про це й каже. Delete = DELETE: ноту знято зовсім; озброюється першим кліком
         замість модалки, другий клік протягом трьох секунд підтверджує,
         бездіяльність роззброює.

         «Send back» на зробленій ноті звідси прибрано разом зі станом
         «чекає на перевірку»: закривати ноту більше не людський крок, це
         робить сторож. Незадоволений результатом користувач ставить нову
         ноту прямо на екрані, де й дивиться правку. */
      document.addEventListener('click', async (e) => {
        const del = e.target.closest('[data-del]')
        const resolve = e.target.closest('[data-resolve]')
        if (!del && !resolve) return
        try {
          if (del) {
            if (!del.classList.contains('is-armed')) {
              del.classList.add('is-armed')
              del.title = 'Click again to delete'
              setTimeout(() => {
                del.classList.remove('is-armed')
                del.title = 'Delete (second click confirms)'
              }, 3000)
              return
            }
            const r = await fetch(`${ANN}/notes/${encodeURIComponent(del.dataset.del)}`, { method: 'DELETE' })
            if (!r.ok) throw new Error('HTTP ' + r.status)
          } else {
            const r = await fetch(`${ANN}/notes/${encodeURIComponent(resolve.dataset.resolve)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: 'resolved' }),
            })
            if (!r.ok) throw new Error('HTTP ' + r.status)
          }
          load()
        } catch (err) {
          /* #note, not #warn: load() repaints #warn every cycle. */
          $('note').innerHTML = `<div class="err">Action failed: ${esc(err.message)}</div>`
        }
      })

      /* ── Group-by-route toggle ────────────────────────────────────────────
         A view mode, not a filter: the same rows, partitioned per screen.
         Remembered like the theme — a reviewer who thinks in screens always
         thinks in screens. */
      let grouped = localStorage.getItem('fixlog-group') === '1'
      const setMode = (on) => {
        grouped = on
        localStorage.setItem('fixlog-group', on ? '1' : '0')
        $('segAll').setAttribute('aria-pressed', String(!on))
        $('segPages').setAttribute('aria-pressed', String(on))
        render()
      }
      /* Не тумблер: натиск на вже вибраний сегмент нічого не робить, бо
         сегмент — це стан, а не дія. */
      $('segAll').addEventListener('click', () => grouped && setMode(false))
      $('segPages').addEventListener('click', () => grouped || setMode(true))
      setMode(grouped)

      /* ── Theme ────────────────────────────────────────────────────────────
         The boot script in <head> chose the initial theme; this only has to
         flip and remember. Remembering makes the OS preference a default,
         never an override of an explicit choice. */
      $('theme').addEventListener('click', () => {
        const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        localStorage.setItem('fixlog-theme', t)
      })

      /* ── Details / rework dialog ──────────────────────────────────────── */
      const pop = $('pop')
      let popKey = ''

      /* Two modes, one dialog: reading what a fix did, and telling it to be
         redone. They share the same subject line, so splitting them into two
         components would duplicate more than it separates. */
      function openPop(key, label, mode) {
        popKey = key
        const details = mode === 'info'
        $('popTitle').textContent = details ? 'What was done' : 'Send back'
        const row = state.rows.find((r) => r.key === key)
        $('popSub').innerHTML =
          `${row && row.num ? `<span class="id">${row.num}</span> ` : ''}${esc(label || '')}`
        const open = row ? openRw(row) : null

        const body = $('popBody')
        body.hidden = !details
        if (details) {
          /* Chronological: what the fix did first, then the thread — each
             iteration is note (why it was rejected) plus, once closed, what
             the redo changed. This dialog is the whole corpus entry in one
             view: запит → зроблено → чому не влаштувало → що виправлено. */
          const thread = (row ? rwOf(row) : []).map((rw, j) =>
            `<div class="pop__it${rw.done ? '' : ' pop__it--open'}">
              <div class="pop__it-head">rework ${j + 1} · ${
                rw.done ? 'fixed' : 'open'
              }${rw.at ? ' · ' + hhmm(Date.parse(rw.at)) : ''}</div>
              <div>${inline(rw.note || '')}</div>
              ${rw.result ? `<div class="pop__it-res">${inline(rw.result)}</div>` : ''}
            </div>`).join('')
          /* Розмова над живою нотою (`thread[]` з контракту нот): агент
             перепитує, людина відповідає. Той самий діалог, бо це той самий
             жанр — усе, що сказали ПРО цю правку, в одному місці. */
          const talk = ((row && row.thread) || []).map((m) =>
            `<div class="pop__it">
              <div class="pop__it-head">${m.role === 'human' ? 'you' : 'agent'}${
                m.at ? ' · ' + hhmm(Date.parse(m.at)) : ''
              }</div>
              <div>${inline(m.content || '')}</div>
            </div>`).join('')
          /* Елемент, на якому поставили ноту. Йде ПЕРШИМ: питання, з яким
             сюди відкривають живу ноту, — «про що взагалі мова», і воно
             старше за «що з нею робили».

             `outerHTML` свідомо не показуємо, хоч він у ноті є. Це обрізаний
             на 2048 символах однорядковий шматок розмітки з інлайновими
             атрибутами — у діалозі він виглядав би сміттям і витіснив би
             рядки, які справді ведуть до коду. Усе, що з нього потрібно для
             впізнання елемента (тег, класи, текст), лежить в окремих полях
             контракту й показане тут окремо.

             Порожні поля пропускаються, а не малюються прочерками: у
             діалозі, на відміну від таблиці, немає сітки, яку треба
             тримати. */
          const el = row && row.el
          const pair = (k, v, prose) =>
            v ? `<dt>${k}</dt><dd${prose ? ' class="is-prose"' : ''}>${esc(v)}</dd>` : ''
          const elBlock = el
            ? (() => {
                const parts = [
                  pair('screen', routeOf(el.url) || el.url),
                  /* Селектор — те, чим агент знайде елемент. Коли стабільного
                     не вийшло, контракт гарантує fullPath, і показувати треба
                     саме його: інакше в найважчому випадку рядок порожній. */
                  el.selector
                    ? pair('selector', el.selector)
                    : pair('path', el.fullPath),
                  pair('element', el.tagName
                    ? el.tagName.toLowerCase() + (el.classes ? '.' + el.classes.trim().split(/\s+/).join('.') : '')
                    : ''),
                  pair('components', el.components.join(' ← ')),
                  pair('text', el.text, true),
                ].join('')
                return parts ? `<dl class="pop__el">${parts}</dl>` : ''
              })()
            : ''
          body.innerHTML =
            elBlock +
            (row && row.did
              ? inline(row.did)
              : talk || elBlock ? '' : '<span class="muted">No description.</span>') +
            talk + thread
        }
        /* The form only exists in rework mode. Re-opening while an iteration
           is still open pre-fills its note: sending again AMENDS the open
           instruction (the server keeps one open iteration per fix). */
        $('popNote').hidden = details
        $('popSend').hidden = details
        $('popCancel').textContent = details ? 'Close' : 'Cancel'
        $('popNote').value = open ? open.note : ''
        $('popErr').textContent = ''
        pop.hidden = false
        if (!details) $('popNote').focus()
      }
      const closePop = () => { pop.hidden = true; popKey = '' }

      $('popScrim').addEventListener('click', closePop)
      $('popCancel').addEventListener('click', closePop)
      document.addEventListener('keydown', (e) => {
        if (!pop.hidden && e.key === 'Escape') closePop()
      })

      document.addEventListener('click', (e) => {
        const info = e.target.closest('[data-info]')
        if (info) {
          e.stopPropagation()
          const key = info.dataset.info
          const row = state.rows.find((r) => r.key === key)
          openPop(key, row ? plain(row.req) : '', 'info')
          return
        }
        const b = e.target.closest('[data-redo]')
        if (!b) return
        e.stopPropagation() // must not also open the drawer behind it
        const key = b.dataset.redo
        const row = state.rows.find((r) => r.key === key)
        openPop(key, row ? plain(row.req) : '', 'redo')
      })

      $('popSend').addEventListener('click', async () => {
        const note = $('popNote').value.trim()
        if (!note) { $('popErr').textContent = 'Say what is wrong'; return }
        const btn = $('popSend')
        btn.disabled = true
        try {
          const r = await fetch(`${RATE}/rework`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: popKey, note }),
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok || !data.ok) throw new Error(data.error || 'HTTP ' + r.status)
          state.ratings[popKey] = data.rating
          closePop()
          render()
        } catch (err) {
          $('popErr').textContent = 'Send failed: ' + err.message
        } finally {
          btn.disabled = false
        }
      })

      /* ── Живий фавікон ─────────────────────────────────────────────────
         Цю сторінку тримають у фоновій вкладці й позирають на неї, поки
         конвеєр доробляє. Заголовок уже несе лічильники, але у згорнутій
         вкладці з нього видно щонайбільше пару літер — а іконку видно
         завжди. Тож стан «зараз щось у роботі» живе саме в ній.

         Не GIF: Chrome анімовані GIF-фавікони не програє взагалі (Firefox
         програє). Єдиний спосіб, що працює скрізь, — перемальовувати
         <canvas> і щоразу підставляти свіжий data-URL у той самий
         <link rel=icon>.

         Крок дискретний — 12 поділок, а не плавний оберт — і це рішення, не
         економія: у фоновій вкладці браузер тротлить таймери приблизно до
         секунди, тож плавна анімація там усе одно розсипалась би на ривки.
         Дванадцять поділок з таким кроком читаються як стрілка годинника:
         повільно — але навмисно повільно, а не залипло.

         Кадри малюються КОДОМ (дуги по колу), а не перемальовуванням
         вихідної іконки: drawImage з SVG-джерела без явних width/height у
         частині рушіїв мовчки не малює нічого, тож заміна <link> на inline
         data:image/svg+xml крутілки не стосується.

         Коли роботи немає, повертається рівно той href, що стояв у розмітці
         на старті (зараз — inline SVG-знак тулзи). Іконка-крутілка це стан,
         а не нова айдентика сторінки. */
      const favicon = (() => {
        const link = document.querySelector('link[rel="icon"]')
        /* getAttribute, а не .href: беремо рядок як він написаний у HTML,
           щоб віддати назад той самий data:-URL без перетравлення. */
        const IDLE = link.getAttribute('href')
        const N = 32          // 2× за 16px слот вкладки — щоб не мулило
        const R = 13          // зовнішній радіус поділки
        const TICKS = 12
        const cv = document.createElement('canvas')
        cv.width = cv.height = N
        const cx = cv.getContext('2d')

        /* Канва не розуміє var(), тож колір беремо з того самого токена, що
           й уся сторінка, — інакше при перемиканні теми іконка лишалась би
           від попередньої. Якщо браузер не парсить oklch у канві, він мовчки
           ігнорує присвоєння і малює чорним, тому перевіряємо один раз. */
        const probe = document.createElement('canvas').getContext('2d')
        probe.strokeStyle = '#000000'
        probe.strokeStyle = 'oklch(0.72 0.13 245)'
        const OKLCH = probe.strokeStyle !== '#000000'
        const colour = () => {
          if (!OKLCH) return '#4aa3ff'
          const v = getComputedStyle(document.documentElement)
            .getPropertyValue('--info').trim()
          return v || '#4aa3ff'
        }

        let phase = 0
        let timer = null
        let on = false

        const frame = () => {
          cx.clearRect(0, 0, N, N)
          cx.strokeStyle = colour()
          cx.lineCap = 'round'
          cx.lineWidth = 3.4
          for (let i = 0; i < TICKS; i++) {
            /* Голова найяскравіша, хвіст згасає. Рух несе прозорість, а не
               колір, — тому це читається як один об'єкт, що обертається, а
               не як дванадцять крапок, що блимають. */
            const age = (i - phase + TICKS * 2) % TICKS
            cx.globalAlpha = 0.12 + 0.88 * (1 - age / TICKS)
            const a = (i / TICKS) * Math.PI * 2 - Math.PI / 2
            cx.beginPath()
            cx.moveTo(N / 2 + Math.cos(a) * (R - 5), N / 2 + Math.sin(a) * (R - 5))
            cx.lineTo(N / 2 + Math.cos(a) * R, N / 2 + Math.sin(a) * R)
            cx.stroke()
          }
          cx.globalAlpha = 1
          link.href = cv.toDataURL('image/png')
          phase = (phase + 1) % TICKS
        }

        /* Перемикається лише на зміні стану: інакше кожен цикл опитування
           гнав би зайвий toDataURL і смикав <link> без причини. */
        const set = (running) => {
          if (running === on) return
          on = running
          if (running) {
            frame()
            timer = setInterval(frame, 90)
          } else {
            clearInterval(timer)
            timer = null
            link.href = IDLE
          }
        }
        set.isRunning = () => on
        return set
      })()

      /* ── Boot ─────────────────────────────────────────────────────────── */

      async function load() {
        /* The log renders FIRST, from a static file on the same origin. The
           annotation server and the ratings service are both optional, remote,
           and can be slow or firewalled — awaiting them before the first paint
           is what turned this page blank. Draw what is certain, then enrich. */
        const mdRes = await fetch('/fixlog.md?t=' + Date.now())
          .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text() })
          .then((v) => ({ v }), (e) => ({ e: e.message }))

        /* Composed OFF-SCREEN. state.rows is not touched until the whole new
           snapshot is ready: publishing the half-built list (done rows only,
           annotations still in flight) made every cycle collapse the table's
           height and grow it back — the visible "jump". The one exception is
           the very first boot, where partial data beats a blank page. */
        const done = []
        if (!mdRes.e) {
          parseDone(mdRes.v).forEach((r, i) =>
            done.push({ ...r, status: 'done', routePath: r.routeRes || plain(r.route), ts: 0, fresh: i + 1 }))
        }
        if (!state.rows.length && done.length) {
          state.rows = done.slice()
          render()
        }

        /* НЕ скидаємо `ratingsErr` тут. Цей запит навмисно не чекають (він
           повільний і необов'язковий), тож його `.catch` спрацьовує вже
           ПІСЛЯ того, як смужка проблем нижче зібрана. Поки помилку гасили на
           початку кожного циклу, вона не встигала показатись жодного разу:
           записалась о 10-й секунді, стерлась на 10-й з половиною. Тепер вона
           живе, доки запит не пройде вдало, — і саме успіх її й знімає. */
        getJSON(`${RATE}/ratings`)
          .then((v) => {
            state.ratingsErr = ''
            /* Re-render only when the verdicts actually changed — this fires
               every cycle, and an idle page must not repaint on a no-op. */
            const changed = JSON.stringify(v) !== JSON.stringify(state.ratings)
            state.ratings = v
            if (changed) render()
          })
          /* Keep the last good snapshot on a transient failure: blanking the
             threads for one dropped request is worse than being 10s stale. */
          .catch((e) => { state.ratingsErr = e.message })

        const open = await loadOpen().then((v) => ({ v }), (e) => ({ e: e.message }))
        const md = mdRes
        const rows = done.slice()
        /* x is a percentage of the document width, y an absolute pixel
           offset — that is how the toolbar stores a pin. Carried through so
           the drawer can drop the same pin back onto the screen. */
        /* Коли правка з'явилася — це `createdAt` СЕРВЕРА, а не `timestamp`
           тулбара, і різниця тут не академічна.

           `timestamp` ставить браузерний тулбар у мить, коли користувач тицьнув
           пін, і тримає його в localStorage. Тулбар періодично перезаливає свої
           локальні копії — під НОВИМ id, але зі СТАРИМ `timestamp`. Тобто
           запис, який щойно потрапив у чергу, приносить із собою час, коли його
           набрали в браузері годинами раніше. На сервері це видно впритул:
           вісім анотацій із `createdAt` 16:18:40.95x (один bulk-POST, id
           відрізняються мілісекундами) несуть `timestamp` від 11:09 до 15:18 —
           розкид у п'ять годин там, де насправді один момент. Колонка «Час»
           показувала 11:09, а «щойно» перетворювалося на «5год» для рядка, що
           з'явився секунду тому.

           `createdAt` такої проблеми не має: сервер штампує його сам, і він
           збігається з часом, зашитим у сам id (id = base36 від Date.now()
           клієнта в мить запису — звіряється до мілісекунди). Той самий корінь
           уже ламав лічильник роботи; його полагодили через `updatedAt`, а поле
           `at` лишилося сидіти на битому джерелі — оце й лагодиться тут.

           `timestamp` лишається запасним варіантом: на давніх записах, зроблених
           до появи `createdAt`, він єдиний час, який взагалі є. */
        const mk = (a, st) => {
          const created = Date.parse(a.createdAt || '') || a.timestamp || 0
          /* Пін. Нота більше не носить готових x/y тулбара — є `rect`
             (getBoundingClientRect у мить кліку) і `viewport`. Звідси x у
             відсотках ширини й y у пікселях, як їх чекає dropPin. Прокрутки
             в контракті немає, тож на прокрученому екрані пін сяде вище за
             сам елемент — це наближення з реальних даних, а не вигаданe
             поле; краще приблизний маркер, ніж жодного. */
          const rect = a.rect
          const vw = (a.viewport && a.viewport.w) || 0
          const pinX = rect && vw ? ((rect.x + rect.w / 2) / vw) * 100 : undefined
          const pinY = rect ? rect.y + rect.h / 2 : undefined
          return {
            key: a.id, status: st, time: hhmm(created), routePath: routeOf(a.url),
            req: a.note || '',
            /* Смуга виконавця тепер відома і для живої ноти. Раніше тут стояв
               прочерк, бо ноту брав чоловік руками і хто саме — сторінка
               знати не могла. Тепер ноту бере сторож і запускає виконавця
               headless-запуском Claude, тобто «взято» = «claude», і рядок
               малюється тим самим знаком, що й архівні рядки з лога: мова
               колонки одна на всю таблицю. Не взята нота лишається з
               прочерком — там справді ще нікого немає. */
            laneRaw: st === 'new' ? '' : 'claude',
            did: '', ts: created,
            thread: Array.isArray(a.thread) ? a.thread : [],
            /* Контекст елемента, на якому поставили ноту. Тримається сирим
               (як у контракті), а не склеєним у рядок: діалог Details сам
               вирішує, що з цього показати й у якому порядку. */
            el: {
              url: a.url || '',
              selector: a.selector || '',
              fullPath: a.fullPath || '',
              tagName: a.tagName || '',
              classes: a.classes || '',
              text: a.text || '',
              components: Array.isArray(a.components) ? a.components : [],
            },
            /* `at` — коли анотація потрапила в чергу (для «3хв тому» і смуг
               давності).

               `startedAt` — НАБЛИЖЕННЯ, а не факт. Чесного «коли взяли» в
               даних немає: контракт нот (`docs/contract.md`) знає три статуси
               (pending / working / resolved) і жодного поля з моментом
               переходу, а `updatedAt` сервер рухає на БУДЬ-ЯКОМУ PATCH —
               зміні статусу, репліці в треді, завантаженні кадру. Тож для
               ноти, яку взяли годину тому і в якій щойно відповіли, годинник
               роботи перезапуститься з нуля. Це найкраще, що є, і воно значно
               ближче до правди, ніж час створення, — але поки в контракті не
               з'явиться власне поле, комірка може занижувати. */
            at: created,
            startedAt: Date.parse(a.updatedAt || '') || 0,
            x: pinX, y: pinY,
            /* Live annotations always outrank logged ones: they are, by
               definition, the work that has not happened yet. */
            fresh: 1e12 + created,
          }
        }
        /* Ghost filter — тепер СТРАХОВКА, а не механізм.

           Дублі народжувалися з того, що виконавець видаляв закриту анотацію,
           а тулбар перезаливав із localStorage усе, чийого id сервер не знає.
           Обидва кінці полагоджено там, де вони живуть: виконавцям заборонено
           DELETE (анотація лишається `resolved`, і тулбару нема що доливати),
           а диспетчер відсіює на вході за підписом «роут + елемент + текст»,
           не за id. Фільтр лишається для копій, що вже лежать по браузерах із
           тих часів: сервер про них не знає, поки вкладку не оновлять.

           Збіг шукаємо ЗА ID, а не за підписом «роут + текст». Підпис не
           працював узагалі: колонка «Роут» у лозі — рукописна проза
           («`/search` (`Search` → `.sr-featured__tag`)»), чистим шляхом була
           лише 71 комірка з 292, а текст запиту в індексі несе суфікс `(id)`,
           якого нормалізація не знімала. Тобто фільтр не ловив нічого.
           Тепер ловити є чим: індекс має колонку `ID`, а ім'я теки правки для
           ноти — це і є її власний id (`n-…`), тож дубль впізнається точним
           порівнянням ключів. */
        const doneKeys = new Set(done.map((r) => r.key).filter(Boolean))
        const isGhost = (a) => doneKeys.has(a.id)

        let ghosts = 0
        if (!open.e) {
          for (const a of open.v.pending) {
            if (isGhost(a)) { ghosts++; continue }
            rows.push(mk(a, 'new'))
          }
          for (const a of open.v.working) {
            if (isGhost(a)) { ghosts++; continue }
            rows.push(mk(a, 'wip'))
          }
          /* `resolved` малюється як `wip`, і власного стану більше не має:
             сторож закриває таку ноту сам, щойно допише рядок у fixlog.md,
             тож вона живе секунди. Ці секунди конвеєр із нею ще працює —
             отже «в роботі» тут не наближення, а правда.

             Без ghost-фільтра свідомо: сторож дописує рядок в індекс раніше,
             ніж робить `DELETE` ноти, і ключ рядка — це той самий id. Тобто
             фільтр за id відсіяв би рядок за мить до того, як нота закриється,
             і той просто блимнув би. Фільтр стережеться дублів тулбара, а
             тулбар перезаливає лише нові ноти, не завершені. */
          for (const a of open.v.resolved) rows.push(mk(a, 'wip'))
        }
        /* Every fix gets a number, closed ones included — it is the short
           handle a human quotes back ("правка 14"), and the composite key in
           the ID column is too long to say out loud.

           Ordered oldest-first across the whole set, so a number, once given,
           never changes: the log only ever grows at the end, and live
           annotations sort after everything already logged. The same number is
           the circle drawn on the screen in the drawer. */
        rows.sort((a, b) => (a.fresh || 0) - (b.fresh || 0))
          .forEach((r, i) => { r.num = i + 1 })
        state.rows = rows
        render()

        const problems = []
        /* Перша й найважча: якщо скрипт десь упав, решта чисел на сторінці
           може бути просто неповною. */
        if (fatalMsg) problems.push(fatalMsg)
        if (open.e) problems.push(`Notes server (${ANN}) — ${open.e}`)
        if (md.e) problems.push(`fixlog.md — ${md.e}`)
        if (state.ratingsErr) problems.push(`Ratings (${RATE}) — ${state.ratingsErr}`)
        /* Same-string guard: these repaint every cycle, and an idle strip
           must not be rebuilt (and reflowed) for identical content. */
        const warnHtml = problems.length
          ? `<div class="err">${problems.map(esc).join(' · ')}</div>` : ''
        if ($('warn').innerHTML !== warnHtml) $('warn').innerHTML = warnHtml

        /* Рахуємо ЕФЕКТИВНИЙ статус (`stOf`), а не сирий, і рахуємо по тих
           самих `rows`, що намальовані. Інакше числа розходяться з таблицею:
