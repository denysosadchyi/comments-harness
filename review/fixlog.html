           жива нота з відкритою доробкою підписана «Sent back», але сирий
           статус у неї `wip` — і вона потрапляла водночас у «in progress» і в
           «sent back» та ще й крутила фавікон. `done` так само рахувалось як
           «усі рядки лога», включно з тими, що зараз повернуті на доробку. */
        const byStatus = (k) => rows.filter((r) => stOf(r) === k).length
        const nAsk = byStatus('ask')
        const nNewShown = byStatus('new')
        const nWipShown = byStatus('wip')
        const nRedo = byStatus('redo')
        const nDoneShown = byStatus('done')
        /* The tally carries the same marks as the Статус column, so it
           doubles as that column's legend. The conditional entries only
           appear when they have something to say — a permanent «0 на
           доробці» would be noise in the busiest line on the page. */
        const items = []
        /* Перший у смужці з тієї ж причини, з якої перший у сортуванні: це
           єдина робота, розблокувати яку може тільки той, хто дивиться. */
        if (nAsk) items.push(['ask', nAsk, `needs you <span class="tally__hint">— answer in the page overlay</span>`])
        items.push(
          ['new', nNewShown, 'new'],
          ['wip', nWipShown, 'in progress'],
        )
        if (nRedo) items.push(['redo', nRedo, 'sent back'])
        items.push(['done', nDoneShown, nDoneShown === 1 ? 'fix' : 'fixes'])
        if (ghosts) items.push(['done', ghosts, 'duplicates hidden'])
        const countHtml = items.map(([k, n, word]) =>
          `<span class="tally__i">${stMark(k)}<b>${n}</b> ${word}</span>`
        ).join('')
        if ($('count').innerHTML !== countHtml) $('count').innerHTML = countHtml
        /* Ті САМІ числа, що в смужці лічильників, і в тому ж порядку: нове /
           в роботі / архів. Заголовок брав сирі довжини списків із сервера,
           смужка — відфільтровані рядки, і на кожному ghost чи доробці вкладка
           обіцяла одне, а сторінка показувала інше. Одне джерело — один звіт. */
        document.title = `Comments Harness (${nNewShown}/${nWipShown}/${nDoneShown})`
        /* Крутиться рівно з того числа, що видно в лічильнику «в роботі», а
           не з сирого open.v.working: дублі, приховані як ghost, у таблиці не
           показані, і іконка не має обіцяти роботу, якої на екрані немає. */
        favicon(nWipShown > 0)
      }


      /* Sticky engages silently; the shadow needs to know. Passive and
         cheap: one class flip when the panel's top crosses the viewport. */
      /* Одна смуга заголовків на сторінку — та сама в обох режимах, і вона
         ніколи не ховається. Список із двох і перевірка `.hidden` лишалися з
         часів, коли таблиця й панелі мали кожна свою шапку. */
      const headWrap = $('gheadWrap')
      addEventListener('scroll', () => {
        headWrap.classList.toggle('is-stuck', headWrap.getBoundingClientRect().top < 0)
      }, { passive: true })

      /* Auto-refresh. The dispatcher works while this page is open, so a
         static snapshot is stale within a minute.

         Three guards, each for a real failure this page has already shown:
         — paused while a dialog is open, so a reload cannot yank the popup or
           the drawer out from under a click;
         — paused while the tab is hidden, so a page left open overnight is not
           still polling a dev server every 10s;
         — skipped if the previous cycle has not finished, so a slow pass
           never stacks on top of the next one. */
      let inFlight = false
      const guardedLoad = async () => {
        if (inFlight) return
        if (!pop.hidden || !dr.hidden) return
        /* Ховану вкладку не опитуємо — окрім випадку, коли щось у роботі.
           Причина в іконці: крутілку видно саме тоді, коли на сторінку не
           дивляться, і якщо цикл при цьому спить, вона крутитиметься ще
           довго після того, як конвеєр усе доробив. Спінер, що бреше, гірший
           за його відсутність. Правило «сторінка, забута на ніч, не довбає
           дев-сервер» лишається чинним: без роботи в черзі опитування так
           само зупиняється. */
        if (document.hidden && !favicon.isRunning()) return
        inFlight = true
        try { await load() } finally { inFlight = false }
      }
      setInterval(guardedLoad, 10000)
      /* Coming back to the tab should feel current immediately, not in ten
         seconds. */
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) guardedLoad()
      })

      load()
    </script>
  </body>
</html>
